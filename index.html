<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16242b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="농장에서 재료를 기르고 붕어빵을 구워 판매하는 붕어빵 타이쿤 2 웹 실행판">
  <title>붕어빵 타이쿤 2 · 힐링 농장</title>
  <link rel="stylesheet" href="web/style.css">
  <link rel="stylesheet" href="web/v2.css">
  <script src="web/asset-manifest.js" defer></script>
  <script src="web/animation-manifest.js" defer></script>
  <script src="web/game.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">붕</span><div><strong>붕어빵 타이쿤 2</strong><small>FARM × BAKE × SELL</small></div></div>
      <div id="hud" class="hud" aria-label="게임 재화"></div>
      <button id="catalog-toggle" class="icon-button" type="button" aria-label="원본 에셋 도감">▦</button>
      <button id="sound-toggle" class="icon-button" type="button" aria-label="소리 켜기 또는 끄기">♪</button>
    </header>
    <main id="app" class="game-area"></main>
    <footer class="bottom-bar"><span>CNATION · BUNGOPANG 2</span><span id="save-state">브라우저에 자동 저장</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
